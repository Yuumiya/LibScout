services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - libscout-data:/app/.libscout
    ports:
      - "8000:8000"

  seed:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: ["seed"]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - libscout-data:/app/.libscout
    command: ["/app/.venv/bin/python", "scripts/seed_repositories.py", "--root-dir", "/app/.libscout"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  libscout-data:
